name: scrape
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scraper/scrape.mjs
      - name: Commit data
        run: |
          git config user.name "offers-bot"
          git config user.email "offers-bot@users.noreply.github.com"
          git add data/offers.json
          git diff --cached --quiet || (git commit -m "chore: update offers" && git push)
